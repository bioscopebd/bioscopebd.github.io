name: BioscopeBD iOS simulator build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Xcode
        run: xcodebuild -version
      - name: Prepare Capacitor iOS project
        working-directory: ios/app
        run: |
          npm ci
          mkdir -p assets
          cp ../../00-shared-web/icons/icon-1024.png assets/icon.png
          cp ../../00-shared-web/icons/splash-2732.png assets/splash.png
          npx @capacitor/assets generate --ios --iconBackgroundColor '#0b0b0f' --splashBackgroundColor '#0b0b0f'
          npx cap sync ios
      - name: Build unsigned simulator app
        run: |
          xcodebuild -project ios/app/ios/App/App.xcodeproj \
            -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/release/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent \
            ios/release/DerivedData/Build/Products/Debug-iphonesimulator/App.app \
            ios/release/BioscopeBD-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BioscopeBD-ios-simulator
          path: ios/release/BioscopeBD-ios-simulator.zip
